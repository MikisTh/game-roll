<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Roleta Matricial 12x12</title>

<style>
  body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f0f1a;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1{
    margin-top:20px;
    color:#00ffcc;
  }

  .container{
    display:flex;
    gap:30px;
    margin-top:20px;
    flex-wrap:wrap;
    justify-content:center;
  }

  /* ROleta */
  .roleta{
    width:200px;
    height:200px;
    border-radius:50%;
    border:6px solid #00ffcc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    transition: transform 2s ease-out;
    background: radial-gradient(circle,#1a1a2e,#000);
  }

  button{
    margin-top:15px;
    padding:10px 20px;
    background:#00ffcc;
    border:none;
    cursor:pointer;
    font-weight:bold;
  }

  /* MATRIZ */
  .grid{
    display:grid;
    grid-template-columns: repeat(12, 20px);
    grid-gap:3px;
    background:#111;
    padding:10px;
    border-radius:10px;
  }

  .cell{
    width:20px;
    height:20px;
    background:#222;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:3px;
  }

  .active{
    background:#00ffcc;
    color:black;
    font-weight:bold;
  }

  .info{
    margin-top:10px;
    font-size:14px;
    color:#aaa;
  }
</style>
</head>

<body>

<h1>🎡 Roleta Matricial 12x12</h1>

<div class="container">

  <div>
    <div class="roleta" id="roleta">?</div>
    <button onclick="girar()">GIRAR</button>
    <div class="info" id="info">Sequência: -</div>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script>
const simbolos = ["✦","✧","✪","✩","✺","✹","✶","✷","✸","✴","✵","✳"];

let grid = document.getElementById("grid");

// criar matriz 12x12
for(let i=0;i<144;i++){
  let div = document.createElement("div");
  div.classList.add("cell");
  div.innerText = simbolos[Math.floor(Math.random()*simbolos.length)];
  grid.appendChild(div);
}

function girar(){
  const roleta = document.getElementById("roleta");
  const info = document.getElementById("info");

  let rotacao = Math.floor(Math.random()*3600);
  roleta.style.transform = `rotate(${rotacao}deg)`;

  let simbolo = simbolos[Math.floor(Math.random()*simbolos.length)];
  roleta.innerText = simbolo;

  // sequência simbólica
  let seq = "";
  for(let i=0;i<5;i++){
    seq += simbolos[Math.floor(Math.random()*simbolos.length)];
  }

  info.innerText = "Sequência: " + seq;

  // ativa célula aleatória na matriz
  let cells = document.querySelectorAll(".cell");
  cells.forEach(c => c.classList.remove("active"));

  for(let i=0;i<5;i++){
    let rand = Math.floor(Math.random()*cells.length);
    cells[rand].classList.add("active");
  }
}
</script>

</body>
</html>
